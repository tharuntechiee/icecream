<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Category standard sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#0f172a;font:400 16px system-ui,sans-serif}
nav{height:72px;display:flex;align-items:center;gap:32px;padding:0 64px;border-bottom:1px solid #e2e8f0}
nav b{font-size:24px;color:#1d4ed8}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:64px}
h1{font:800 64px/1.05 system-ui;letter-spacing:-1.5px}
.hero p{font-size:20px;color:#475569;margin:22px 0 30px}
.btn{background:#1d4ed8;color:#fff;padding:16px 28px;border-radius:10px;font-weight:600;display:inline-block}
.img{background:linear-gradient(135deg,#dbeafe,#eff6ff);border-radius:20px;height:420px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:0 64px}
.row div{height:120px;border:1px solid #e2e8f0;border-radius:14px;padding:20px;font-weight:700;font-size:22px}
</style></head><body>
<nav><b>ChillCrate</b><span>Products</span><span>Events</span><span>Delivery</span><span>Contact</span></nav>
<div class="hero"><div><h1>Bulk ice cream supply for every occasion</h1><p>Wholesale tubs, cups, kulfi and ice delivered frozen across Hyderabad.</p><span class="btn">Get a quote</span></div><div class="img"></div></div>
<div class="row"><div>Ice creams</div><div>Custom packs</div><div>Ice</div><div>Rentals</div></div>
</body></html>
